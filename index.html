<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodcord | Test Site</title>
    <style>
        /* Basic Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark Mode Styling */
        body {
            background-color: #0f111a;
            color: #f4f5f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Container Card */
        .card {
            background-color: #171a26;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            max-width: 450px;
            width: 100%;
            border: 1px solid #23283b;
        }

        /* Elements styling */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #5865F2; /* Sleek blurple accent color */
        }

        p {
            color: #a3a7b5;
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Temporary Button styling */
        .btn {
            display: block;
            width: 100%;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">Test Website Live</div>
        <h1>Goodcord</h1>
        <p>This is a temporary landing page to test hosting configuration, routing, and verification files.</p>
        <a href="#" class="btn">Launch Portal</a>
    </div>

</body>
</html>
